<!DOCTYPE html>  <html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Musically</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#ffffff}
html{transition:--acc .9s ease}
:root{--line:rgba(255,255,255,.16);--ink:#f5f5f5;--muted:#a1a1a8;--w:min(100%,560px);color-scheme:dark;
  --lg-fill:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 50%,rgba(255,255,255,.10));
  --lg-lite:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  --lg-rim:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{min-height:100vh;color:var(--ink);font:400 16px/1.4 Outfit,system-ui,sans-serif;background:#000}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(60% 42% at 50% 0%,color-mix(in srgb,var(--acc,#fff) 24%,transparent),transparent 72%),radial-gradient(50% 36% at 100% 100%,color-mix(in srgb,var(--acc,#fff) 14%,transparent),transparent 72%)}
body.themed::after{opacity:1}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}  /* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:var(--lg-fill);
-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
box-shadow:var(--lg-rim),inset 0 0 26px rgba(255,255,255,.05),0 16px 44px rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.25)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
background:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.06) 30%,rgba(255,255,255,.04) 70%,rgba(255,255,255,.5));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 14% -12%,rgba(255,255,255,.24),transparent 55%)}
.pill,.chip,.ib,.add,.cb.on{background:var(--lg-lite);border:0;box-shadow:var(--lg-rim),0 6px 18px rgba(0,0,0,.25)}
.pill.on{background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.14))}

.wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;width:100%;max-width:960px;align-self:center;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 260px;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.top{position:relative;flex:none;width:calc(100% - 32px);max-width:928px;align-self:center;margin:calc(10px + env(safe-area-inset-top)) 0 6px;z-index:7;background:transparent;padding:0 2px;display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:48px}
.brand{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.top form{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.top input{display:none;width:100%;padding:11px 18px;border-radius:999px;border:0;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--lg-rim);color:var(--ink);font:inherit}
.top input:focus{outline:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.sbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--lg-lite);box-shadow:var(--lg-rim),0 6px 18px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.top.s .brand{display:none}
.top.s form{flex:1;margin-left:0}
.top.s input{display:block;flex:1}
.greet{font-size:2.3rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:26px 2px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:999px}
.chip:hover{background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.1))}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;margin:28px 2px 12px}
.msg{color:var(--muted);padding:24px 4px}
.pill{padding:9px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.i{display:grid;place-items:center;pointer-events:none}
.hero{display:flex;gap:18px;align-items:center;padding:16px;border-radius:30px;margin:18px 0 0}
.hart{width:128px;height:128px;flex:none;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.16)}
.htx{min-width:0}
.htx b{font-size:1.7rem;letter-spacing:-.02em;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hbtn{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#d9d9e6);color:#000;font-weight:700;padding:10px 20px;border-radius:999px;box-shadow:inset 0 1px 0 #fff,0 8px 22px rgba(0,0,0,.35),0 0 28px rgba(255,255,255,.15)}
@media (max-width:520px){.hart{width:92px;height:92px}.htx b{font-size:1.3rem}.greet{font-size:1.9rem}}
.rail{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.card{flex:0 0 148px;position:relative;scroll-snap-align:start}
.art{display:block;position:relative;width:148px;height:148px;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 12px 28px rgba(0,0,0,.45)}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.14);background:linear-gradient(160deg,rgba(255,255,255,.2),transparent 38%)}
.art img,.th img,.th .ph,.ph,.hart img,.hart .ph{width:100%;height:100%;object-fit:cover;display:block;background:#141416}
.add{position:absolute;right:8px;top:100px;width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1}
.t{display:block;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 20px}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:18px;transition:background .2s}
.row:hover,.row.cur{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.pop{opacity:.4;transform:translateY(20px) scale(.93);transform-origin:50% 100%;transition:transform .6s cubic-bezier(.2,1.6,.35,1),opacity .3s ease,background .2s}
.pop.top{transform:translateY(-9px) scale(.95);transform-origin:50% 0}
.pop.in{opacity:1;transform:none}
.rank{width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rbtn{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.rbtn>img,.rbtn>.ph,.th{width:52px;height:52px;border-radius:14px;flex:none;overflow:hidden;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.tx{min-width:0}.tx .t{margin:0}
.d{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.ib{width:36px;height:36px;border-radius:50%;font-size:1.15rem;flex:none}
.eq{display:none;position:absolute;inset:0;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center;gap:3px;padding:15px 0}
.cur .eq{display:flex}
.eq s{display:block;width:4px;height:22px;background:#fff;border-radius:2px;transform:scaleY(.3);transform-origin:bottom}
.playing .cur .eq s{animation:eq .9s ease-in-out infinite alternate}
.eq s:nth-child(2){animation-delay:.3s!important}.eq s:nth-child(3){animation-delay:.6s!important}
@keyframes eq{to{transform:scaleY(1)}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc,#fff) var(--p,0%),rgba(255,255,255,.2) var(--p,0%));box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfcfe0);box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}

.player{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:10;max-width:900px;margin:0 auto;border-radius:30px;padding:10px;display:grid;grid-template-columns:56px 1fr auto;grid-template-areas:"vid info ctl" "seek seek seek";gap:8px 12px;align-items:center}
.vid{grid-area:vid;flex:none;width:56px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#141416;box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.14)}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid img[hidden]{display:none}
.meta{grid-area:info;min-width:0;display:flex;align-items:center;gap:8px}
.info{flex:1;min-width:0;text-align:left}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{grid-area:ctl;display:flex;align-items:center;gap:6px}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.like.on{color:#ff6b95;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.play{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#fff,#d9d9e6);color:#000;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 #fff,0 8px 22px rgba(0,0,0,.4),0 0 26px rgba(255,255,255,.18)}
.seek{grid-area:seek;display:grid;grid-template-columns:38px 1fr 38px;gap:10px;align-items:center;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.seek span:last-child{text-align:right}
.qbox,.sheetbar,.prev,.like,.shuf,.rep,.lyr,.karb{display:none}

.player.open{top:0;bottom:0;left:0;right:0;max-width:none;margin:0;border-radius:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:#000;box-shadow:none}
.player.open::before,.player.open::after{display:none}
.open>*{flex:none}
.open .sheetbar{display:flex;align-items:center;justify-content:space-between;width:var(--w);align-self:center;order:0;color:var(--muted);font-weight:600}
.sheetbar .pill{padding:6px 11px;font-size:.82rem;color:var(--ink)}
.sbr{display:flex;gap:8px}
.open .vid{order:1;width:min(var(--w),380px);align-self:center;border-radius:28px;box-shadow:0 28px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.18);transform:scale(.88);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
body.playing .open .vid{transform:scale(1)}
.open.showlyr .vid{display:none}
.open.showlyr .lyr{display:block;order:1;width:var(--w);align-self:center}
.open .meta{order:2;width:var(--w);align-self:center}
.open .info b{font-size:1.65rem;letter-spacing:-.02em;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.open .info span{font-size:.95rem;margin-top:2px}
.open .like{display:grid;width:44px;height:44px}
.open .seek{order:3;width:var(--w);align-self:center}
.open .ctl{order:4;width:var(--w);align-self:center;justify-content:space-between}
.open .prev,.open .shuf,.open .rep{display:grid}
.open .cb{width:44px;height:44px}
.open .ctl .cb{width:54px;height:54px;background:var(--lg-lite);box-shadow:var(--lg-rim),0 6px 16px rgba(0,0,0,.3)}
.open .ctl .cb.on{background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(255,255,255,.16))}
.open .play{width:82px;height:82px}
.open .qbox{order:7;display:block;width:var(--w);align-self:center}
.qh{display:flex;align-items:center;justify-content:space-between}
.qh>div{display:flex;gap:8px}
.qh .pill{padding:6px 14px;font-size:.9rem}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;height:64px;border-radius:999px;z-index:9;display:flex;align-items:center;justify-content:space-around;padding:6px;gap:4px}
.nav button{flex:1;height:100%;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.72rem;font-weight:600;position:relative;z-index:1}
.nav button.on{color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:var(--lg-rim)}
/ ---------- long-press menu ---------- /
.row,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row img,.card img{pointer-events:none;-webkit-user-drag:none}
.mbd{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.msheet{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:31;border-radius:28px;padding:12px;background:linear-gradient(145deg,rgba(34,34,38,.98),rgba(14,14,16,.99));animation:sheet .25s cubic-bezier(.2,1.1,.4,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.mhead{display:flex;gap:12px;align-items:center;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;min-width:0}
.mi{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;font-weight:600;position:relative;z-index:1}
.mi:active{background:rgba(255,255,255,.12)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;padding:10px 18px;border-radius:999px;background:rgba(28,28,30,.97);box-shadow:var(--lg-rim),0 10px 30px rgba(0,0,0,.5);font-weight:600;animation:fade .2s;white-space:nowrap}
/ ---------- pull to refresh, library settings, karaoke ---------- /
.ptr{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);opacity:0;z-index:8;pointer-events:none;padding:8px 16px;border-radius:999px;background:var(--lg-lite);box-shadow:var(--lg-rim);font-size:.9rem}
.lset{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.railw{position:relative}
.rarr{display:none;position:absolute;top:54px;width:42px;height:42px;border-radius:50%;z-index:3;place-items:center;background:rgba(20,20,22,.9);box-shadow:var(--lg-rim),0 6px 18px rgba(0,0,0,.4)}
.rarr.l{left:-6px}.rarr.r{right:-6px}
.rarr.l .i{transform:rotate(90deg)}.rarr.r .i{transform:rotate(-90deg)}
@media (hover:hover) and (pointer:fine){.railw:hover .rarr{display:grid}}
.open.karaoke .vid,.open.karaoke .meta,.open.karaoke .qbox{display:none}
.open.karaoke .lyr{height:min(62vh,680px)}
.open.karaoke .ll{font-size:2.1rem}
.open.showlyr .karb{display:inline-flex}
[hidden]{display:none!important}
.sug{position:fixed;left:16px;right:16px;max-width:928px;margin:0 auto;top:calc(76px + env(safe-area-inset-top));z-index:6;border-radius:24px;padding:6px;background:rgba(18,18,20,.96);box-shadow:var(--lg-rim),0 18px 44px rgba(0,0,0,.5);animation:sugin .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes sugin{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.sg{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:16px;text-align:left}
.sg:active{background:rgba(255,255,255,.12)}
.sg .i{color:var(--muted)}
.sg span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbg{display:none}
/ ---------- lyrics ---------- /
.lyr{position:relative;height:min(46vh,420px);overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.lyr::-webkit-scrollbar{display:none}
.lyrin{padding:42% 2px}
.ll{margin:0;padding:9px 4px;font-size:1.6rem;font-weight:700;line-height:1.25;letter-spacing:-.015em;color:rgba(255,255,255,.3);transform-origin:left center;transition:color .3s,transform .3s;cursor:pointer}
.ll.past{color:rgba(255,255,255,.46)}
.ll.on{color:#fff;transform:scale(1.04);text-shadow:0 0 6px rgba(255,255,255,.55),0 0 18px var(--acc,#ffffff),0 0 40px var(--acc,#ffffff);animation:lglow 2.4s ease-in-out infinite alternate}
@keyframes lglow{from{text-shadow:0 0 6px rgba(255,255,255,.45),0 0 14px var(--acc,#ffffff),0 0 30px var(--acc,#ffffff)}to{text-shadow:0 0 8px rgba(255,255,255,.7),0 0 24px var(--acc,#ffffff),0 0 54px var(--acc,#ffffff)}}
.ll.past{text-shadow:0 0 14px color-mix(in srgb,var(--acc,#ffffff) 25%,transparent)}
.lmsg{color:var(--muted);text-align:center;margin:0;padding:0 8px}
.lplain{white-space:pre-wrap;margin:0;font-size:1.15rem;line-height:1.6;color:rgba(255,255,255,.82);padding:0 4px}
.lyr.static .lyrin{padding:80px 2px}
/ ---------- nicer player card ---------- /
.aur,.grab{display:none}
.open .aur{display:block;position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(55% 38% at 50% 8%,color-mix(in srgb,var(--acc,#7a5cff) 50%,transparent),transparent 72%),radial-gradient(48% 34% at 95% 92%,color-mix(in srgb,var(--acc,#7a5cff) 32%,transparent),transparent 72%);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.08)}}
.open .grab{display:block;order:0;width:var(--w);align-self:center;height:22px;position:relative;touch-action:none;margin:-8px 0 -14px}
.open .grab::before{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:rgba(255,255,255,.3)}
.open .vid{width:min(var(--w),300px,40vh);border-radius:28px;touch-action:none;position:relative;box-shadow:0 22px 56px color-mix(in srgb,var(--acc,#000) 34%,rgba(0,0,0,.6)),0 0 0 1px rgba(255,255,255,.2)}
.open .vid::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 36%);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.open .info{text-align:center}
.open .info b{font-size:1.35rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
.open .meta::before{content:"";width:44px;flex:none}
.open .info span{color:color-mix(in srgb,var(--acc,#cfcfe0) 35%,#d6d6e6);font-weight:600}
.open .seek input{height:6px}
.open .seek input::-webkit-slider-thumb{width:14px;height:14px;box-shadow:0 0 14px var(--acc,#fff),0 0 0 1px rgba(255,255,255,.6)}
.open .ctl{background:none;box-shadow:none;padding:0 2px}
.open .ctl .cb{width:44px;height:44px;background:none;box-shadow:none}
.open .ctl .cb.on{background:none;box-shadow:none;color:var(--acc,#fff)}
.open .play{width:64px;height:64px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.open .qbox{padding:14px 12px;border-radius:28px;background:var(--lg-lite);box-shadow:var(--lg-rim),0 14px 40px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.open .qbox .qh{padding:0 6px 4px}
.open .qbox h2{margin:0}
.open .like.on svg{animation:lkpop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes lkpop{from{transform:scale(.6)}}
.player:not(.open) .seek{grid-template-columns:1fr}
.player:not(.open) .seek span{display:none}
.player:not(.open) .seek input{height:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== UI upgrade: pure black, flatter, calmer ===== */
:root{--surface:#0d0d0f;--surface2:#16161a;--line:rgba(255,255,255,.09);--muted:#8e8e96}
body.themed::after{opacity:.75}
::selection{background:color-mix(in srgb,var(--acc,#fff) 40%,transparent)}
:focus-visible{outline:2px solid var(--acc,#fff);outline-offset:2px}
.greet{font-size:2rem;margin:20px 2px 2px}

/* ---------- Spotify-style suggestions, built from your liked songs ---------- */
const mainArtist=a=>String(a||'').split(/,|&|\bfeat\.?|\bft\.?|\bx\b|\+/i)[0].trim();
function recSeeds(){
  const sc=new Map(),n=liked.length;
  liked.forEach((t,i)=>{const a=mainArtist(t.artist);if(a)sc.set(a,(sc.get(a)||0)+1+(n-i)/n)}); /* newer likes count more */
  try{getHist().slice(0,20).forEach(t=>{const a=mainArtist(t.artist);if(a)sc.set(a,(sc.get(a)||0)+.3)})}catch(e){}
  const top=[...sc].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const seeds=[],last=mainArtist(liked[0]&&liked[0].artist);
  if(last)seeds.push(last);
  top.forEach(a=>{if(seeds.length<3&&!seeds.includes(a))seeds.push(a)});
  return seeds;
}
async function recData(seeds){
  const sig=seeds.join('|');
  try{const c=JSON.parse(localStorage.getItem('mrec'));if(c&&c.sig===sig&&Date.now()-c.t<3*3600e3)return c.data}catch(e){}
  const res=await Promise.all(seeds.map(a=>fetch('/api/search?q='+encodeURIComponent(a+' songs')).then(r=>r.ok?r.json():[]).catch(()=>[])));
  const data={};let any=false;
  seeds.forEach((a,i)=>{data[a]=Array.isArray(res[i])?res[i].slice(0,20):[];if(data[a].length)any=true});
  if(any)try{localStorage.setItem('mrec',JSON.stringify({sig,t:Date.now(),data}))}catch(e){}
  return data;
}
function dayRand(){ /* same shuffle all day, new one tomorrow */
  let a=Math.floor(Date.now()/864e5)>>>0;
  return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296};
}
async function fillRecs(box){
  if(!liked.length){box.replaceChildren(h('p',{class:'msg'},'Songs ko \u2665 like karo, phir yahan tumhare liye suggestions aayenge.'));return}
  box.replaceChildren(h('h2',{},'Made for you'),skel());
  const seeds=recSeeds();
  let data={};try{data=await recData(seeds)}catch(e){}
  if(!box.isConnected)return;
  const have=new Set(liked.map(x=>x.id)),rnd=dayRand();
  const lists=seeds.map(a=>({a,tr:(data[a]||[]).filter(t=>t&&t.id&&!have.has(t.id))}));
  /* Daily Mix: shuffled round-robin across your top artists */
  const pools=lists.map(l=>{const c=l.tr.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c});
  const mix=[],used=new Set();
  for(let i=0;mix.length<16&&i<20;i++)pools.forEach(p=>{const t=p[i];if(t&&!used.has(t.id)&&mix.length<16){used.add(t.id);mix.push(t)}});
  const secs=[];
  if(mix.length>=4)secs.push(h('section',{},h('h2',{},'Your Daily Mix'),railw(mix)));
  lists.forEach(l=>{
    const tr=l.tr.filter(t=>!used.has(t.id));
    if(tr.length<4)return;
    const title=l.a===mainArtist(liked[0].artist)?'Because you liked '+liked[0].title:'More like '+l.a;
    secs.push(h('section',{},h('h2',{},title),railw(tr)));
  });
  box.replaceChildren(...secs);
}

/* ---------- live synced lyrics (LRCLIB via /api/lyrics) ---------- */
const LYR=new Map(); /* song id -> {lines, plain} */
let lyrOn=false,lyrId=null,lyrLines=[],lyrEls=[],lyrIdx=-1,userScrollAt=0;

function parseLrc(s){
  const out=[];
  for(const raw of s.split(/\r?\n/)){
    const stamps=[...raw.matchAll(/(\d+):(\d+(?:\.\d+)?)/g)];
    if(!stamps.length)continue;
    const text=raw.replace(/[^]*\]/g,'').trim();
    if(!text)continue;
    for(const m of stamps)out.push({t:+m[1]*60+ +m[2],text});
  }
  return out.sort((a,b)=>a.t-b.t);
}
/* index of the last line whose timestamp is <= c (binary search), -1 if none */
function idxAt(lines,c){
  let lo=0,hi=lines.length-1,i=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].t<=c){i=m;lo=m+1}else hi=m-1} 
  return i;
}
async function getLyr(t){
  let d=LYR.get(t.id);if(d)return d;
  const q=new URLSearchParams({title:t.title,artist:t.artist});
  if(t.seconds)q.set('duration',t.seconds);
  const r=await fetch('/api/lyrics?'+q);
  if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
  const j=await r.json();
  d={lines:j.synced?parseLrc(j.synced):[],plain:j.plain||''};
  LYR.set(t.id,d);
  return d;
}
function lyrMsg(text){
  lyrLines=[];lyrEls=[];lyrIdx=-1;
  $('lyr').classList.remove('static');
  $('lyrin').replaceChildren(h('p',{class:'lmsg'},text));
}
function renderLyrics(d){
  lyrIdx=-1;
  if(d.lines.length){
    lyrLines=d.lines;
    lyrEls=d.lines.map(l=>h('p',{class:'ll',onclick:()=>{userScrollAt=0;au.currentTime=l.t;if(au.paused)au.play().catch(()=>{})}},l.text));
    $('lyr').classList.remove('static');
    $('lyrin').replaceChildren(...lyrEls);
  }else if(d.plain){
    lyrLines=[];lyrEls=[];
    $('lyr').classList.add('static');
    $('lyrin').replaceChildren(h('p',{class:'lplain'},d.plain));
  }else lyrMsg('No lyrics found for this song');
}
async function showLyrics(){
  const t=queue[index];
  if(!t){lyrId=null;return lyrMsg('Play a song to see lyrics')}
  if(lyrId===t.id){updLyr(true);return}
  lyrId=t.id;
  $('lyr').scrollTop=0;
  if(!LYR.has(t.id))lyrMsg('Finding lyrics…');
  let d;

function wrapText(x,text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const test=line?line+' '+w:w;
      if(x.measureText(test).width>maxW&&line){out.push(line);line=w}else line=test;
    }
    out.push(line);
  }
  return out;
}
function loadImg(src){
  return new Promise(r=>{const m=new Image();m.crossOrigin='anonymous';m.onload=()=>r(m);m.onerror=()=>r(null);m.src=src});
}
async function shareCard(){
  const t=queue[index];if(!t)return;

    if(!im&&src)im=await loadImg('/api/img?url='+encodeURIComponent(src));
    const rr=(X,Y,w,hh,r)=>{x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,hh,r);else x.rect(X,Y,w,hh)};
    const fit=(s,w)=>{if(x.measureText(s).width<=w)return s;while(s.length>1&&x.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
    x.fillStyle='#000';x.fillRect(0,0,W,H);

    x.fillStyle=g;x.fillRect(0,0,W,H);

    for(const l of L2){x.fillText(l,90,y);y+=fs*.62*1.2}
    /* song panel */

    x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;x.stroke();

/* ---------- listen together (WebSocket room) ---------- */
function leaveRoom(){const w=ws;ws=null;if(w)w.close();$('togBtn').textContent='Together';$('togBtn').classList.remove('on')}
function joinRoom(code){
  leaveRoom();
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+encodeURIComponent(code));
  ws=w;
  w.onopen=()=>{$('togBtn').textContent='Room '+code;$('togBtn').classList.add('on')};
  w.onclose=()=>{if(ws===w){ws=null;$('togBtn').textContent='Together';$('togBtn').classList.remove('on')}};
  w.onmessage=e=>{
    const m=JSON.parse(e.data);
    ignoreUntil=Date.now()+1200; /* don't echo what we just received */
    if(m.type==='hello'){
      /* brand-new room: we become the source of truth */
      if(m.empty&&queue.length){ignoreUntil=0;send({type:'track',queue,index});if(!au.paused)send({type:'play',t:au.currentTime})}
    }else if(m.type==='track'){
      const cur=queue[index],nxt=m.queue[m.index];
      queue=m.queue;
      if(cur&&nxt&&cur.id===nxt.id&&hasSrc()){index=m.index;try{localStorage.setItem('mq',JSON.stringify({queue,index}))}catch(e){}renderQ();now()}
      else playIndex(m.index);
    }
    else if(m.type==='play'){au.currentTime=m.t;au.play().catch(()=>{})}
    else if(m.type==='pause'){au.pause();au.currentTime=m.t}
    else if(m.type==='seek'){au.currentTime=m.t}
  };
}
$('togBtn').addEventListener('click',()=>{
  if(ws)return leaveRoom();
  const c=prompt('Room code daalo (khali chhodo to naya ban jayega)');
  if(c===null)return;
  const code=c.trim().toUpperCase()||Math.random().toString(36).slice(2,6).toUpperCase();
  if(!c.trim())alert('Dost ko ye code do: '+code);
  joinRoom(code);
});

/* page change: old content slides out, new content slides in (direction follows tab order) */
async function navGo(v){
  const from=navCur,tok=++navTok;
  const run=()=>{
    if(v==='home'){$('q').value='';closeSearch();home()}
    else if(v==='set'){closeSearch();settings()}
    else if(v==='explore'){closeSearch();explore()}
    else{closeSearch();library()}
  };
  setNav(v);
  const m=$('main');
  if(v===from||!m.animate||matchMedia('(prefers-reduced-motion: reduce)').matches){run();return}
  const dir=NAVORDER.indexOf(v)>NAVORDER.indexOf(from)?1:-1;
  const out=m.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX('+(-dir*32)+'px)',opacity:0}],{duration:130,easing:'ease-in',fill:'forwards'});
  try{await out.finished}catch(e){}
  if(tok!==navTok)return; /* a newer tap took over */
  run();
  m.getAnimations().forEach(a=>a.cancel());
  m.animate([{transform:'translateX('+(dir*40)+'px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:360,easing:'cubic-bezier(.22,1,.36,1)'});
}

let sleepT=0,sleepMin=0;
function cycleSleep(){

/* ---------- dynamic accent colour from album art ---------- */
const ACC=new Map();let accId=null;
const ACC2=new Map();
function setAcc(c,c2){const r=document.documentElement.style;if(c){r.setProperty('--acc',c);r.setProperty('--acc2',c2||c)}else{r.removeProperty('--acc');r.removeProperty('--acc2')}}
function pickColor(im){
  try{
    const cv=document.createElement('canvas');cv.width=cv.height=24;
    const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data,B=new Map();
    for(let i=0;i<d.length;i+=4){
      const R=d[i]/255,G=d[i+1]/255,Bl=d[i+2]/255,mx=Math.max(R,G,Bl),mn=Math.min(R,G,Bl),l=(mx+mn)/2,dd=mx-mn;
      if(l<.14||l>.88||dd<.12)continue;
      let hh=mx===R?((G-Bl)/dd)%6:mx===G?(Bl-R)/dd+2:(R-G)/dd+4;hh=Math.round(hh*60+360)%360;
      const k=Math.floor(hh/30),o=B.get(k)||{w:0,h:0};o.w+=dd;o.h+=hh*dd;B.set(k,o);
    }
    const top=[...B.values()].sort((p,q)=>q.w-p.w);if(!top.length)return null;
    const H=o=>Math.round(o.h/o.w),a=H(top[0]);
    const b=top.find((o,i)=>i&&Math.abs(H(o)-a)>25&&Math.abs(H(o)-a)<335);
    return{a:'hsl('+a+' 80% 62%)',b:'hsl('+(b?H(b):(a+40)%360)+' 75% 55%)'};
  }catch(e){return null}
}
async function accent(t){
  if(!t){accId=null;return setAcc(null)}
  if(accId===t.id)return;
  accId=t.id;
  if(ACC.has(t.id))return setAcc(ACC.get(t.id),ACC2.get(t.id));
  const src=big(t);if(!src)return setAcc(null);
  let im=await loadImg(src);
  if(!im)im=await loadImg('/api/img?url='+encodeURIComponent(src));
  if(!im)return;
  const c=pickColor(im);ACC.set(t.id,c&&c.a);ACC2.set(t.id,c&&c.b);
  if(accId===t.id)setAcc(c&&c.a,c&&c.b);
}

/* ---------- player gestures: drag down to close, swipe artwork for next/prev ---------- */
(()=>{
  let x0=0,y0=0,dx=0,dy=0,on=false,mode='',busy=false,raf=0,lx=0,lt=0,vx=0;
  const vid=P.querySelector('.vid'),meta=P.querySelector('.meta');
  const isOpen=()=>P.classList.contains('open');
  const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const zoneV=e=>e.target.closest&&e.target.closest('.grab,.sheetbar,.vid');
  const zoneH=e=>{
    const t=e.target;if(!t.closest)return false;
    return isOpen()?!!t.closest('.vid'):!t.closest('input,.ctl,.like');
  };
  const canNext=()=>index+1<queue.length||(rep&&queue.length>0);
  const canPrev=()=>index>0&&!(hasSrc()&&au.currentTime>3);
  const reset=()=>{P.style.transition='transform .25s ease';P.style.transform='';setTimeout(()=>{P.style.transition='';P.style.willChange=''},260)};

  /* live drag: art follows the finger, title/artist follow slower and fade */
  const apply=()=>{
    raf=0;
    const can=dx<0?canNext():canPrev();
    const x=dx*(can?1:.3);
    vid.style.translate=x+'px 0';
    vid.style.opacity=String(1-Math.min(.55,Math.abs(x)/420));
    meta.style.translate=(x*.55)+'px 0';
    meta.style.opacity=String(1-Math.min(.85,Math.abs(x)/240));
  };
  const clearInline=()=>{[vid,meta].forEach(e=>{e.style.translate='';e.style.opacity='';e.style.willChange=''})};
  const cur=e=>({x:parseFloat((e.style.translate||'0').split(' ')[0])||0,o:e.style.opacity===''?1:parseFloat(e.style.opacity)});

  const snapBack=()=>{
    [vid,meta].forEach(e=>{
      const c=cur(e);
      e.animate([{translate:c.x+'px 0',opacity:c.o},{translate:'0px 0',opacity:1}],{duration:420,easing:'cubic-bezier(.34,1.35,.5,1)'});
    });
    clearInline();
  };

  /* commit: old art flies out, song changes, new art glides in from the other side */
  const commit=async dir=>{ /* dir -1 = next (exit left), +1 = previous (exit right) */
    busy=true;
    const W=Math.min(innerWidth,500);
    if(reduce()){clearInline();dir<0?next(true):prev();busy=false;return}
    const outs=[vid,meta].map((e,i)=>{
      const c=cur(e);e.style.willChange='translate,opacity';
      return e.animate([{translate:c.x+'px 0',opacity:c.o},{translate:(dir*W*(i?.35:.7))+'px 0',opacity:0}],{duration:170,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
    });
    try{await Promise.all(outs.map(a=>a.finished))}catch(e){}
    clearInline();
    if(dir<0)next(true);else prev();
    const ni=$('npImg');
    try{if(ni&&!ni.hidden&&ni.decode)await Promise.race([ni.decode(),sleep(260)])}catch(e){}
    outs.forEach(a=>a.cancel());
    [vid,meta].forEach((e,i)=>{
      e.animate([{translate:(-dir*W*(i?.25:.5))+'px 0',opacity:0},{translate:'0px 0',opacity:1}],
        {duration:i?460:520,delay:i?50:0,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
    });
    await sleep(560);
    busy=false;
  };

  P.addEventListener('touchstart',e=>{
    if(busy){on=false;return}
    const okV=isOpen()&&zoneV(e)&&P.scrollTop<=0,okH=zoneH(e);
    if(!okV&&!okH){on=false;return}
    on=true;mode='';dx=dy=0;vx=0;x0=lx=e.touches[0].clientX;y0=e.touches[0].clientY;lt=performance.now();
    P.dataset.zv=okV?1:'';P.dataset.zh=okH?1:'';
  },{passive:true});
  P.addEventListener('touchmove',e=>{
    if(!on)return;
    const t=e.touches[0],now=performance.now();
    dx=t.clientX-x0;dy=t.clientY-y0;
    if(now>lt){vx=.8*vx+.2*((t.clientX-lx)/(now-lt));lx=t.clientX;lt=now}
    if(!mode){
      if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
      mode=Math.abs(dy)>Math.abs(dx)?'v':'h';
      if(mode==='h'&&!P.dataset.zh){on=false;return}
      if(mode==='v'&&!P.dataset.zv){on=false;return}
      if(mode==='h'){vid.style.willChange=meta.style.willChange='translate,opacity'}
      else P.style.willChange='transform';
    }
    if(mode==='v'&&dy>0){P.style.transition='none';P.style.transform='translateY('+dy+'px)'}
    else if(mode==='h'&&!raf)raf=requestAnimationFrame(apply);
  },{passive:true});
  const end=()=>{
    if(!on)return;on=false;
    if(raf){cancelAnimationFrame(raf);raf=0}
    if(mode==='v'){
      if(dy>110){setOpen(false);reset()}else reset();
      return;
    }
    if(mode==='h'){
      const go=Math.abs(dx)>70||(Math.abs(vx)>.5&&Math.abs(dx)>25);
      const dir=dx<0?-1:1;
      if(go&&(dir<0?canNext():canPrev()))return commit(dir);
      if(go){ /* nothing to slide to: still trigger the action (radio / restart) but bounce back */
        dir<0?next(true):prev();
      }
      snapBack();
    }
  };
  P.addEventListener('touchend',end);
  P.addEventListener('touchcancel',()=>{if(mode==='h')snapBack();on=false;reset()});
})();
