<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musically</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.16);--ink:#f4f4f8;--muted:#9b9bab;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:400 16px/1.4 Outfit,system-ui,sans-serif;background:radial-gradient(60% 40% at 10% 0%,#2a1d6b66,transparent),radial-gradient(50% 40% at 95% 25%,#5a143f55,transparent),#050507;background-attachment:fixed}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;background:var(--art,none) center/cover;filter:blur(80px) saturate(1.5);opacity:.34}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 44px rgba(0,0,0,.5)}
.wrap{max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 170px}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;border-radius:999px;padding:8px 8px 8px 20px;display:flex;gap:12px;align-items:center}
.brand{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.top form{flex:1;min-width:0;display:flex}
.top input{width:100%;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);font:inherit}
.top input:focus{outline:none;border-color:rgba(255,255,255,.6)}
.greet{font-size:2.3rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:26px 2px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.chip:hover{background:rgba(255,255,255,.14)}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;margin:28px 2px 12px}
.msg{color:var(--muted);padding:24px 4px}
.pill{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.hero{display:flex;gap:18px;align-items:center;padding:16px;border-radius:28px;margin:18px 0 0}
.hart{width:128px;height:128px;flex:none;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hart img,.hart .ph{width:100%;height:100%;object-fit:cover;display:block}
.htx{min-width:0}
.htx b{display:block;font-size:1.7rem;letter-spacing:-.02em;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hbtn{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pbtn{background:#fff;color:#000;font-weight:700;padding:10px 20px;border-radius:999px}
@media (max-width:520px){.hart{width:92px;height:92px}.htx b{font-size:1.3rem}.greet{font-size:1.9rem}}
.rail{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.card{flex:0 0 148px;position:relative;scroll-snap-align:start}
.art{display:block;width:148px;height:148px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--glass)}
.art img,.th img,.th .ph,.ph{width:100%;height:100%;object-fit:cover;display:block;background:#1a1a22}
.add{position:absolute;right:8px;top:100px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:1.2rem;line-height:1}
.t{display:block;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 20px}
.row{display:flex;align-items:center;gap:10px;padding:6px;border-radius:16px}
.row:hover,.row.cur{background:var(--glass)}
.rank{width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rbtn{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.rbtn>img,.rbtn>.ph,.th{width:52px;height:52px;border-radius:12px;flex:none;overflow:hidden;position:relative}
.tx{min-width:0}.tx .t{margin:0}
.d{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:1.15rem;flex:none}
.eq{display:none;position:absolute;inset:0;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center;gap:3px;padding:15px 0}
.cur .eq{display:flex}
.eq s{display:block;width:4px;height:6px;background:#fff;border-radius:2px}
.playing .cur .eq s{animation:eq .9s ease-in-out infinite alternate}
.eq s:nth-child(2){animation-delay:.3s!important}.eq s:nth-child(3){animation-delay:.6s!important}
@keyframes eq{to{height:22px}}

.player{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;max-width:900px;margin:0 auto;border-radius:28px;padding:10px;display:grid;grid-template-columns:64px 1fr auto;grid-template-areas:"vid info ctl" "seek seek seek";gap:8px 12px;align-items:center}
.vid{grid-area:vid;position:relative;isolation:isolate;width:64px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#14141a}
.ytl{position:absolute;left:0;top:0;width:220px;height:220px;z-index:0;pointer-events:none}
.ytl iframe{width:100%;height:100%;display:block;border:0}
.cover{position:absolute;inset:0;z-index:1;background:#14141a}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover img[hidden]{display:none}
.info{grid-area:info;min-width:0;text-align:left}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{display:block;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{grid-area:ctl;display:flex;align-items:center;gap:6px}
.cb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem}
.play{width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:1.1rem}
.seek{grid-area:seek;display:grid;grid-template-columns:36px 1fr 36px;gap:8px;align-items:center;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#fff}
.vol,.qbox,.close,.prev,.like{display:none}

.player.open{top:0;bottom:0;left:0;right:0;max-width:none;margin:0;border-radius:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:rgba(6,6,10,.8);-webkit-backdrop-filter:blur(44px);backdrop-filter:blur(44px)}
.open .close{display:block;align-self:flex-end;order:0}
.open .vid{order:1;flex:none;width:min(100%,420px);align-self:center;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.open .info{order:2;text-align:center;width:min(100%,640px);align-self:center}
.open .info b{font-size:1.5rem}
.open .seek{order:3;width:min(100%,640px);align-self:center}
.open .ctl{order:4;justify-content:center;gap:18px}
.open .prev,.open .like{display:grid}
.open .vol{order:5;display:flex;align-items:center;gap:10px;width:min(100%,640px);align-self:center;color:var(--muted)}
.open .vol input{flex:1}
.open .qbox{order:6;display:block;width:min(100%,640px);align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="glass top">
    <button class="brand" id="homeBtn" type="button">Musically</button>
    <form id="f" role="search">
      <input id="q" type="search" placeholder="Search songs, artists" aria-label="Search songs" autocomplete="off">
    </form>
  </header>
  <main id="main"></main>
</div>

<section class="glass player" id="player" aria-label="Player">
  <button class="close pill" id="close" type="button">Close</button>
  <div class="vid" id="stage">
    <div class="ytl" aria-hidden="true"><div id="yt"></div></div>
    <div class="cover"><img id="coverImg" alt="" hidden></div>
  </div>
  <button class="info" id="expand" type="button" aria-expanded="false"><b id="npT">Nothing playing</b><span id="npA">Search or pick a song</span></button>
  <div class="ctl">
    <button class="cb prev" id="prev" type="button" aria-label="Previous song">&#9198;</button>
    <button class="play" id="toggle" type="button" aria-label="Play">&#9654;</button>
    <button class="cb" id="next" type="button" aria-label="Next song">&#9197;</button>
    <button class="cb like" id="like" type="button" aria-label="Like song" aria-pressed="false">&#9825;</button>
  </div>
  <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  <label class="vol">Volume <input id="vol" type="range" min="0" max="100" value="80"></label>
  <div class="qbox"><h2>Up next</h2><div id="queue"></div></div>
</section>

<script>
const $=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}e.append(...c);return e};
let queue=[],index=-1,player=null,ready=false,pending=null,seeking=false,liked=[];
const P=$('player');
const GENRES=['Bollywood','Punjabi','Hip-hop','Lo-fi','Romantic','Devotional','Party'];

function save(){try{localStorage.setItem('mq',JSON.stringify({queue,index}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('mq'));if(s&&Array.isArray(s.queue)){queue=s.queue;index=Math.min(s.index,queue.length-1)}}catch(e){}try{liked=JSON.parse(localStorage.getItem('ml'))||[]}catch(e){}}
const hi=u=>u.replace(/=w\d+-h\d+/,'=w720-h720');
let coverId=null;
function setCover(t){
  const ci=$('coverImg'),id=t?t.id:null;
  if(id===coverId)return;
  coverId=id;
  if(t&&t.thumbnail){
    ci.onerror=()=>{ci.onerror=null;ci.src=t.thumbnail};
    ci.src=hi(t.thumbnail);ci.hidden=false;
  }else{ci.onerror=null;ci.removeAttribute('src');ci.hidden=true}
}
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const img=t=>t.thumbnail?h('img',{src:t.thumbnail,alt:'',loading:'lazy'}):h('div',{class:'ph'});
const isLiked=t=>!!t&&liked.some(x=>x.id===t.id);
function toggleLike(t){
  if(!t)return;
  liked=isLiked(t)?liked.filter(x=>x.id!==t.id):[t,...liked];
  try{localStorage.setItem('ml',JSON.stringify(liked))}catch(e){}
  syncLike();
}
function syncLike(){const b=$('like'),l=isLiked(queue[index]);b.textContent=l?'♥':'♡';b.setAttribute('aria-pressed',l)}

function card(t,list,i){
  return h('div',{class:'card'},
    h('button',{class:'art',type:'button','aria-label':'Play '+t.title,onclick:()=>playList(list,i)},img(t)),
    h('button',{class:'add',type:'button','aria-label':'Add '+t.title+' to queue',onclick:()=>addQ(t)},'+'),
    h('span',{class:'t'},t.title),h('span',{class:'a'},t.artist));
}
function row(t,list,i,rank){
  const kids=[];
  if(rank)kids.push(h('span',{class:'rank'},String(rank)));
  kids.push(h('button',{class:'rbtn',type:'button','aria-label':'Play '+t.title,onclick:()=>playList(list,i)},
    h('span',{class:'th'},img(t),h('span',{class:'eq'},h('s'),h('s'),h('s'))),
    h('span',{class:'tx'},h('span',{class:'t'},t.title),h('span',{class:'a'},t.artist))));
  kids.push(h('span',{class:'d'},t.duration||''));
  kids.push(h('button',{class:'ib',type:'button','aria-label':'Add '+t.title+' to queue',onclick:()=>addQ(t)},'+'));
  const r=h('div',{class:'row'},...kids);r.dataset.id=t.id;return r;
}
function section(s,n){
  return h('section',{},h('h2',{},s.title),n===0
    ?h('div',{class:'chart'},...s.tracks.map((t,i)=>row(t,s.tracks,i,i+1)))
    :h('div',{class:'rail'},...s.tracks.map((t,i)=>card(t,s.tracks,i))));
}
function greet(){
  const hr=new Date().getHours();
  return h('h1',{class:'greet'},hr<5?'Late night vibes':hr<12?'Good morning':hr<17?'Good afternoon':'Good evening');
}
function chips(){
  return h('div',{class:'chips'},...GENRES.map(g=>h('button',{class:'chip',type:'button',onclick:()=>{$('q').value=g+' songs';$('f').requestSubmit()}},g)));
}
function hero(s){
  const t=s.tracks[0];
  return h('div',{class:'hero glass'},
    h('div',{class:'hart'},img(t)),
    h('div',{class:'htx'},h('b',{},t.title),h('span',{class:'a'},t.artist),
      h('div',{class:'hbtn'},
        h('button',{class:'pbtn',type:'button',onclick:()=>playList(s.tracks,0)},'▶ Play top '+s.tracks.length),
        h('button',{class:'pill',type:'button',onclick:()=>addQ(t)},'+ Queue'))));
}

async function home(){
  const m=$('main');m.replaceChildren(greet(),chips(),h('p',{class:'msg'},'Loading trending…'));
  try{
    const r=await fetch('/api/trending');
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    const secs=await r.json();
    m.replaceChildren(greet(),chips(),secs.length?hero(secs[0]):'',
      ...(liked.length?[section({title:'Liked songs',tracks:liked},1)]:[]),
      ...secs.map((s,n)=>section(s,n)));
    now();
  }catch(e){
    m.replaceChildren(greet(),chips(),h('p',{class:'msg'},'Could not load trending: '+e.message),h('button',{class:'pill',type:'button',onclick:home},'Try again'));
  }
}
$('homeBtn').addEventListener('click',()=>{$('q').value='';home()});

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=$('q').value.trim();
  if(!q)return home();
  const m=$('main');m.replaceChildren(h('p',{class:'msg'},'Searching…'));
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(q));
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    const tr=await r.json();
    m.replaceChildren(h('h2',{},'Results for “'+q+'”'),tr.length?h('div',{class:'chart'},...tr.map((t,i)=>row(t,tr,i))):h('p',{class:'msg'},'No songs found. Try a different search.'));
    now();
  }catch(err){
    m.replaceChildren(h('p',{class:'msg'},'Search failed: '+err.message+'. Check that the server is running.'));
  }
});

function playList(list,i){queue=list.slice();playIndex(i)}
function addQ(t){queue.push(t);if(index<0)playIndex(0);else{save();renderQ()}}
function playIndex(i){
  if(i<0||i>=queue.length)return;
  index=i;const t=queue[i];
  if(ready)player.loadVideoById(t.id);else pending=t.id;
  save();renderQ();now();
}
function next(){if(index+1<queue.length)playIndex(index+1)}
function prev(){
  if(ready&&player.getCurrentTime()>3)return player.seekTo(0,true);
  if(index>0)playIndex(index-1);
}
function rmQ(i){
  queue.splice(i,1);
  if(i<index)index--;
  else if(i===index){
    if(queue.length){index=Math.min(index,queue.length-1);return playIndex(index)}
    index=-1;if(ready)player.stopVideo();now();
  }
  save();renderQ();
}
function renderQ(){
  const up=queue.map((t,i)=>[t,i]).filter(x=>x[1]>index);
  $('queue').replaceChildren(...(up.length?up.map(([t,i])=>h('div',{class:'row'},
    h('button',{class:'rbtn',type:'button','aria-label':'Play '+t.title,onclick:()=>playIndex(i)},img(t),h('span',{class:'tx'},h('span',{class:'t'},t.title),h('span',{class:'a'},t.artist))),
    h('button',{class:'ib',type:'button','aria-label':'Remove '+t.title,onclick:()=>rmQ(i)},'×')))
    :[h('p',{class:'msg'},'Queue is empty. Tap + on any song.')]));
}
function now(){
  const t=queue[index];
  $('npT').textContent=t?t.title:'Nothing playing';
  $('npA').textContent=t?t.artist:'Search or pick a song';
  document.title=t?t.title+' · Musically':'Musically';
  document.body.style.setProperty('--art',t&&t.thumbnail?'url("'+t.thumbnail+'")':'none');
  if('mediaSession'in navigator&&t)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:t.thumbnail?[{src:t.thumbnail}]:[]});
  document.querySelectorAll('#main .row').forEach(r=>r.classList.toggle('cur',!!t&&r.dataset.id===t.id));
  setCover(t);
  syncLike();
}
function setToggle(p){
  $('toggle').textContent=p?'⏸':'▶';
  $('toggle').setAttribute('aria-label',p?'Pause':'Play');
  document.body.classList.toggle('playing',p);
}

$('toggle').addEventListener('click',()=>{
  if(!ready)return;
  if(index<0&&queue.length)return playIndex(0);
  player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo();
});
$('next').addEventListener('click',next);
$('prev').addEventListener('click',prev);
$('like').addEventListener('click',()=>toggleLike(queue[index]));
$('vol').addEventListener('input',e=>{if(ready)player.setVolume(+e.target.value)});
$('seek').addEventListener('input',()=>{seeking=true;if(ready)$('cur').textContent=fmt($('seek').value/1000*player.getDuration())});
$('seek').addEventListener('change',()=>{if(ready)player.seekTo($('seek').value/1000*player.getDuration(),true);seeking=false});
setInterval(()=>{
  if(!ready||seeking||index<0)return;
  const d=player.getDuration()||0,c=player.getCurrentTime()||0;
  $('cur').textContent=fmt(c);$('dur').textContent=fmt(d);
  $('seek').value=d?Math.round(c/d*1000):0;
},500);

function setOpen(o){P.classList.toggle('open',o);document.body.classList.toggle('lock',o);$('expand').setAttribute('aria-expanded',o)}
$('expand').addEventListener('click',()=>setOpen(!P.classList.contains('open')));
$('close').addEventListener('click',()=>setOpen(false));
$('stage').addEventListener('click',()=>{if(!P.classList.contains('open'))setOpen(true)});
addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});

const tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt',{
    width:'100%',height:'100%',
    playerVars:{playsinline:1,rel:0,controls:0,modestbranding:1},
    events:{
      onReady:()=>{
        ready=true;player.setVolume(+$('vol').value);
        if(pending){player.loadVideoById(pending);pending=null}
        else if(index>=0&&queue[index])player.cueVideoById(queue[index].id);
      },
      onStateChange:e=>{setToggle(e.data===YT.PlayerState.PLAYING);if(e.data===YT.PlayerState.ENDED)next()},
      onError:()=>next()
    }
  });
};

if('mediaSession'in navigator){
  navigator.mediaSession.setActionHandler('play',()=>ready&&player.playVideo());
  navigator.mediaSession.setActionHandler('pause',()=>ready&&player.pauseVideo());
  navigator.mediaSession.setActionHandler('nexttrack',next);
  navigator.mediaSession.setActionHandler('previoustrack',prev);
}

load();renderQ();now();home();
</script>
</body>
</html>
